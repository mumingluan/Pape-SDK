db_uri: "sqlite://./data/data.db"
# db_uri: "mysql://pape:pape@tcp(127.0.0.1:3306)/pape?charset=utf8mb4&parseTime=true&loc=Local"
config_dir: "./config"

patchlist:
  passthrough: false

sdk:
  enabled: true
  bind_host: "0.0.0.0"
  bind_port: 8088

inner_api:
  enabled: true
  bind_host: "127.0.0.1"
  bind_port: 18081
  auth_token: "replace-with-a-long-random-secret"

booi_inner:
  500058:
    base_url: "http://127.0.0.1:18082"
    auth_token: "replace-with-a-long-random-secret"
    timeout_seconds: 5

# Pape-Storage 管理端。admin_token 仅用于 SDK 向 Storage 签发客户端短期上传令牌。
storage:
  base_url: "http://127.0.0.1:18083"
  public_host: "storage-deepspace.papegames.com"
  admin_token: "replace-with-a-long-random-admin-token"
  timeout_seconds: 5

user_center:
  enabled: true
  bind_host: "0.0.0.0"
  bind_port: 8089
  access_address: "127.0.0.1:8089"

proxy:
  enabled: true
  bind_host: "0.0.0.0"
  bind_port: 8888
  use_http2: true
  passthrough_all_unknown: false
  passthrough_game_address: true
  collect_route: true
  ca_private_key_path: "./certs/rootca.key"
  ca_certificate_path: "./certs/rootca.crt"

authentication:
  real_password: false # true后 /v1/user/login 会校验密码，重置密码和用户中心可设置密码
  real_sms: false      # true后只接受真实生成并保存的验证码，不接受固定虚拟码
  allow_register: true      # false 时未知手机号取码仍返回成功，但不发送、不签发验证码，也不能创建账号
  sms_only_register: false  # true 时短信仅用于新号注册；无密码旧号仅可通过忘记密码首次设密


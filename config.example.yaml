db_uri: "sqlite://./data/data.db"
# db_uri: "mysql://pape:pape@tcp(127.0.0.1:3306)/pape?charset=utf8mb4&parseTime=true&loc=Local"
config_dir: "./config"

patchlist:
  passthrough: false

sdk:
  enabled: true
  bind_host: "0.0.0.0"
  bind_port: 65280

inner_api:
  enabled: true
  bind_host: "127.0.0.1"
  bind_port: 65281
  auth_token: "replace-with-a-long-random-secret"

booi_inner:
  500058:
    base_url: "http://127.0.0.1:65285"
    auth_token: "replace-with-a-long-random-secret"
    timeout_seconds: 5

# 标准阿里云 OSS PostObject V4 配置。真实 OSS 的 endpoint 通常为
# https://<bucket>.oss-<region>.aliyuncs.com；Pape-Storage 使用同一协议。
storage:
  endpoint: "https://storage-deepspace.papegames.com"
  public_base_url: "https://storage-deepspace.papegames.com"
  bucket: "pape"
  region: "cn-hangzhou"
  access_key_id: "replace-with-oss-access-key-id"
  access_key_secret: "replace-with-oss-access-key-secret"
  security_token: "" # 使用阿里云 STS 临时凭证时填写
  policy_ttl_seconds: 1200
  max_upload_bytes: 268435456
  proxy_base_url: "http://127.0.0.1:65287" # 直连真实 OSS 时留空
  public_host: "storage-deepspace.papegames.com"

user_center:
  enabled: true
  bind_host: "0.0.0.0"
  bind_port: 65282
  access_address: "127.0.0.1:65282"

proxy:
  enabled: true
  bind_host: "0.0.0.0"
  bind_port: 13011
  use_http2: true
  passthrough_all_unknown: false
  passthrough_game_address: true
  collect_route: true
  ca_private_key_path: "./certs/rootca.key"
  ca_certificate_path: "./certs/rootca.crt"

authentication:
  real_password: false # true后 /v1/user/login 会校验密码，重置密码和用户中心可设置密码
  real_sms: false      # true后只接受真实生成并保存的验证码，不接受固定虚拟码
  allow_register: true      # false 时未知手机号取码仍返回成功，但不发送、不签发验证码，也不能创建账号
  sms_only_register: false  # true 时短信仅用于新号注册；无密码旧号仅可通过忘记密码首次设密

default_application: "kmT84W9D"

